<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Valeria ✨</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Librería Three.js para la secuencia de texto inicial -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%; height: 100%;
            background: #05040a;
            font-family: 'Poppins', sans-serif;
            color: #f8fafc;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        #webgl-container {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        /* Canvas 2D para el Girasol Ilustrado */
        #sunflower-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s ease;
        }

        /* Pantalla de Bienvenida */
        #intro-overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: #030206;
            z-index: 100;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 1s ease, visibility 1s;
        }

        .btn-start {
            background: none;
            border: 2px solid #f59e0b;
            color: #fef3c7;
            padding: 15px 40px;
            font-family: 'Playfair Display', serif, sans-serif;
            font-size: 1.2rem; font-style: italic;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.25);
            transition: all 0.4s ease;
        }

        .btn-start:hover {
            background: #f59e0b; color: #030206;
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.6);
        }

        /* UI Final con Tarjeta con Borde Dorado Elegante (Mejora 3) */
        .ui-container {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            display: flex; flex-direction: column;
            justify-content: flex-end; align-items: center;
            padding: 20px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .card-message {
            pointer-events: auto;
            background: rgba(15, 13, 22, 0.88);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 20px;
            padding: 22px 25px; text-align: center;
            max-width: 380px; width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9), 0 0 20px rgba(245, 158, 11, 0.15);
            transform: translateY(20px);
            transition: opacity 1.2s ease, transform 1.2s ease, box-shadow 2s ease;
            animation: cardGlow 4s infinite alternate ease-in-out;
        }

        @keyframes cardGlow {
            0% { box-shadow: 0 10px 30px rgba(0,0,0,0.9), 0 0 12px rgba(245, 158, 11, 0.1); }
            100% { box-shadow: 0 10px 30px rgba(0,0,0,0.9), 0 0 24px rgba(245, 158, 11, 0.3); }
        }

        .card-message p {
            font-size: 0.92rem; line-height: 1.6;
            color: #f1f5f9; font-weight: 300;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Bienvenida -->
    <div id="intro-overlay">
        <button class="btn-start" id="start-btn">Comenzar Experiencia</button>
    </div>

    <!-- Canvas de Partículas 3D (para los textos iniciales) -->
    <div id="webgl-container"></div>

    <!-- Canvas 2D Ilustrado (para el Girasol) -->
    <canvas id="sunflower-canvas"></canvas>

    <audio id="bg-music" src="Mine.mp3" loop preload="auto"></audio>

    <div class="ui-container" id="ui-gui">
        <div class="card-message" id="card-message">
            <p>Gracias por cada momento compartido y por ser una persona tan brillante.</p>
        </div>
    </div>

    <script>
        const PARTICLE_COUNT = 3800;
        
        const DURATIONS = {
            textDisplay: 1200, 
            transition: 1800   
        };

        const TEXT_SEQUENCE = [
            "Eres la",
            "persona más",
            "importante",
            "para mí,",
            "te quiero,",
            "Cuidate si ❤️."
        ];

        let camera, scene, renderer, particleSystem;
        let currentPos, targetPos, currentColor, targetColor;
        let isExperienceStarted = false;

        function initThree() {
            const container = document.getElementById('webgl-container');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 25; 

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            currentPos = new Float32Array(PARTICLE_COUNT * 3);
            targetPos = new Float32Array(PARTICLE_COUNT * 3);
            currentColor = new Float32Array(PARTICLE_COUNT * 3);
            targetColor = new Float32Array(PARTICLE_COUNT * 3);

            for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                currentPos[i] = targetPos[i] = (Math.random() - 0.5) * 45;
                currentColor[i] = targetColor[i] = 1.0;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(currentPos, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(currentColor, 3));

            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 16, 16);
            const texture = new THREE.CanvasTexture(canvas);

            const material = new THREE.PointsMaterial({
                size: 0.38,
                vertexColors: true,
                map: texture,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);

            // Estrellas de fondo
            const starsGeo = new THREE.BufferGeometry();
            const starsPos = new Float32Array(1200 * 3);
            for(let i=0; i<3600; i++) { starsPos[i] = (Math.random() - 0.5) * 140; }
            starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
            scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ size: 0.15, color: 0xffffff, transparent: true, opacity: 0.4 })));

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function generateTextPositions(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, 1024, 256);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 80px "Playfair Display", Georgia, serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(text, 512, 128);

            const imgData = ctx.getImageData(0, 0, 1024, 256);
            const pixels = [];

            for (let y = 0; y < 256; y += 2) {
                for (let x = 0; x < 1024; x += 2) {
                    const index = (y * 1024 + x) * 4;
                    if (imgData.data[index] > 128) {
                        pixels.push({
                            x: (x - 512) * 0.045,
                            y: -(y - 128) * 0.045,
                            z: (Math.random() - 0.5) * 0.3
                        });
                    }
                }
            }

            if (pixels.length === 0) {
                for (let p = 0; p < 100; p++) pixels.push({ x: (Math.random()-0.5)*10, y: (Math.random()-0.5)*5, z: 0 });
            }

            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const pt = pixels[i % pixels.length];
                positions[i*3] = pt.x + (Math.random() - 0.5) * 0.08;
                positions[i*3+1] = pt.y + (Math.random() - 0.5) * 0.08;
                positions[i*3+2] = pt.z;

                colors[i*3] = 1.0; 
                colors[i*3+1] = 0.85; 
                colors[i*3+2] = 0.25;
            }
            return { positions, colors };
        }

        function generateDispersedPositions() {
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                positions[i*3] = (Math.random() - 0.5) * 80;
                positions[i*3+1] = (Math.random() - 0.5) * 80;
                positions[i*3+2] = (Math.random() - 0.5) * 50;
                colors[i*3] = 1.0; colors[i*3+1] = 0.8; colors[i*3+2] = 0.3;
            }
            return { positions, colors };
        }

        function setTarget(shapeData) {
            for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                targetPos[i] = shapeData.positions[i];
                targetColor[i] = shapeData.colors[i];
            }
        }

        async function playSequence() {
            const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

            try {
                const textShapes = TEXT_SEQUENCE.map(text => generateTextPositions(text));

                for (let i = 0; i < textShapes.length; i++) {
                    setTarget(textShapes[i]);
                    await wait(DURATIONS.textDisplay + DURATIONS.transition);
                }

                setTarget(generateDispersedPositions());
                
                const sfCanvas = document.getElementById('sunflower-canvas');
                sfCanvas.style.opacity = '1';
                initSunflowerCanvas();

                await wait(1000);

                const ui = document.getElementById('ui-gui');
                const cardElement = document.getElementById('card-message');
                ui.style.opacity = '1';
                cardElement.style.opacity = '1';
                cardElement.style.transform = 'translateY(0)';
            } catch (err) {
                console.error("Error en la secuencia:", err);
            }
        }

        // --- REPRODUCCIÓN DE MÚSICA GARANTIZADA AL DAR CLIC ---
        document.getElementById('start-btn').addEventListener('click', function() {
            if (isExperienceStarted) return;
            isExperienceStarted = true;

            const music = document.getElementById('bg-music');
            music.volume = 0.8;
            music.play().then(() => {
                console.log("Música iniciada correctamente.");
            }).catch(err => {
                console.log("Error al reproducir audio:", err);
            });

            const intro = document.getElementById('intro-overlay');
            const webgl = document.getElementById('webgl-container');

            intro.style.opacity = '0';
            setTimeout(() => { intro.style.visibility = 'hidden'; }, 1000);
            webgl.style.opacity = '1';

            playSequence();
        });

        function animate() {
            requestAnimationFrame(animate);

            for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                currentPos[i] += (targetPos[i] - currentPos[i]) * 0.04;
                currentColor[i] += (targetColor[i] - currentColor[i]) * 0.04;
            }

            particleSystem.geometry.attributes.position.needsUpdate = true;
            particleSystem.geometry.attributes.color.needsUpdate = true;

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==========================================
        // DIBUJO DEL GIRASOL CON RESPLANDOR PALPITANTE
        // ==========================================
        let sfCtx, sfW, sfH;
        let floatingParticles = [];

        function initSunflowerCanvas() {
            const canvas = document.getElementById('sunflower-canvas');
            sfCtx = canvas.getContext('2d');
            
            sfW = canvas.width = window.innerWidth;
            sfH = canvas.height = window.innerHeight;

            for(let i=0; i<45; i++) {
                floatingParticles.push({
                    x: Math.random() * sfW,
                    y: Math.random() * sfH,
                    r: Math.random() * 2.5 + 1,
                    alpha: Math.random() * 0.7 + 0.3,
                    speedY: - (Math.random() * 0.4 + 0.15)
                });
            }

            drawSunflowerLoop();
        }

        let timeSF = 0;
        function drawSunflowerLoop() {
            requestAnimationFrame(drawSunflowerLoop);
            timeSF += 0.025;

            sfCtx.clearRect(0, 0, sfW, sfH);

            const centerX = sfW / 2;
            const centerY = sfH / 2 - 40; 
            const scale = Math.min(sfW, sfH) / 600;

            // 1. MEJORA 2: RESPLANDOR DORADO PALPITANTE (SOFT GLOW PULSE)
            const pulseRadius = (230 + Math.sin(timeSF * 1.5) * 20) * scale;
            const pulseAlpha = 0.35 + Math.sin(timeSF * 1.5) * 0.08;

            const glowGrad = sfCtx.createRadialGradient(centerX, centerY, 10 * scale, centerX, centerY, pulseRadius);
            glowGrad.addColorStop(0, `rgba(255, 200, 50, ${pulseAlpha})`);
            glowGrad.addColorStop(0.5, 'rgba(245, 158, 11, 0.12)');
            glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            sfCtx.fillStyle = glowGrad;
            sfCtx.beginPath();
            sfCtx.arc(centerX, centerY, pulseRadius + 20, 0, Math.PI * 2);
            sfCtx.fill();

            // 2. POLVILLO MÁGICO DE FONDO
            sfCtx.fillStyle = '#fef08a';
            floatingParticles.forEach(p => {
                p.y += p.speedY;
                if(p.y < -10) p.y = sfH + 10;
                sfCtx.globalAlpha = p.alpha * (0.6 + Math.sin(timeSF + p.x) * 0.4);
                sfCtx.beginPath();
                sfCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                sfCtx.fill();
            });
            sfCtx.globalAlpha = 1.0;

            // 3. TALLO VERDE CON MOVIMIENTO SUAVE
            sfCtx.strokeStyle = '#4ade80';
            sfCtx.lineWidth = 14 * scale;
            sfCtx.lineCap = 'round';
            sfCtx.beginPath();
            sfCtx.moveTo(centerX, centerY + 30 * scale);
            const stemCurve = Math.sin(timeSF * 0.8) * 4;
            sfCtx.quadraticCurveTo(centerX + stemCurve, centerY + 160 * scale, centerX, centerY + 280 * scale);
            sfCtx.stroke();

            // 4. HOJAS VERDES
            drawLeaf(sfCtx, centerX - 5 * scale, centerY + 180 * scale, -0.4 + (stemCurve * 0.01), scale, true);
            drawLeaf(sfCtx, centerX + 5 * scale, centerY + 200 * scale, 0.35 + (stemCurve * 0.01), scale, false);

            // 5. PÉTALOS AMARILLOS SUAVES
            const numPetals = 14;
            const petalLength = 110 * scale;
            const petalWidth = 36 * scale;

            for (let i = 0; i < numPetals; i++) {
                const angle = (i / numPetals) * Math.PI * 2 + Math.sin(timeSF * 0.5) * 0.015;
                sfCtx.save();
                sfCtx.translate(centerX, centerY);
                sfCtx.rotate(angle);

                const pGrad = sfCtx.createLinearGradient(0, -30 * scale, 0, -petalLength);
                pGrad.addColorStop(0, '#f97316');
                pGrad.addColorStop(0.4, '#fbbf24');
                pGrad.addColorStop(1, '#facc15');

                sfCtx.fillStyle = pGrad;
                sfCtx.beginPath();
                sfCtx.moveTo(0, -35 * scale);
                sfCtx.bezierCurveTo(-petalWidth / 2, -70 * scale, -petalWidth / 2, -petalLength + 15 * scale, 0, -petalLength);
                sfCtx.bezierCurveTo(petalWidth / 2, -petalLength + 15 * scale, petalWidth / 2, -70 * scale, 0, -35 * scale);
                sfCtx.closePath();
                sfCtx.fill();

                sfCtx.restore();
            }

            // 6. DISCO CENTRAL CAFÉ
            const centerRadius = 55 * scale;
            const centerGrad = sfCtx.createRadialGradient(
                centerX - 10 * scale, centerY - 10 * scale, 5 * scale,
                centerX, centerY, centerRadius
            );
            centerGrad.addColorStop(0, '#78350f');
            centerGrad.addColorStop(0.8, '#451a03');
            centerGrad.addColorStop(1, '#290e02');

            sfCtx.fillStyle = centerGrad;
            sfCtx.beginPath();
            sfCtx.arc(centerX, centerY, centerRadius, 0, Math.PI * 2);
            sfCtx.fill();

            sfCtx.strokeStyle = 'rgba(0,0,0,0.2)';
            sfCtx.lineWidth = 4 * scale;
            sfCtx.stroke();
        }

        function drawLeaf(ctx, x, y, angle, scale, isLeft) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            const lGrad = ctx.createLinearGradient(0, 0, isLeft ? -80 * scale : 80 * scale, 0);
            lGrad.addColorStop(0, '#22c55e');
            lGrad.addColorStop(1, '#4ade80');

            ctx.fillStyle = lGrad;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            const dir = isLeft ? -1 : 1;
            ctx.bezierCurveTo(dir * 30 * scale, -30 * scale, dir * 70 * scale, -20 * scale, dir * 85 * scale, 0);
            ctx.bezierCurveTo(dir * 70 * scale, 30 * scale, dir * 30 * scale, 25 * scale, 0, 0);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        window.onload = initThree;
    </script>
</body>
</html>
